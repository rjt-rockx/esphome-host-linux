# Scenario: SocketCAN canbus platform on a Linux host (e.g. a CAN HAT on a Pi).
# Receives 0x200 and periodically transmits; the interface is configured at the
# OS level (ip link ... type can bitrate N), not by ESPHome.
esphome:
  name: socketcan-valid
host:
api:
logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../../../components

canbus:
  - platform: socketcan
    id: can_a
    interface: can0
    can_id: 0x100
    on_frame:
      - can_id: 0x200
        then:
          - lambda: 'ESP_LOGI("can", "%d", x.size());'
