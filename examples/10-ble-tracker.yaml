# BLE scanning on Linux. Default backend is BlueZ over D-Bus: it talks to the
# running bluetoothd, needs no extra capabilities, and coexists with anything
# else using the adapter (e.g. Home Assistant). Just make sure bluetoothd is
# running and the adapter is powered.
#
# For byte-exact raw advertisements (or a dedicated adapter with no bluetoothd),
# set `hci_backend: true` under esp32_ble_tracker. That path uses raw HCI sockets
# and needs cap_net_admin + cap_net_raw on the binary; grant once after compile:
#
#   scripts/pi-bless-binary.sh .esphome/build/pi-ble/.pioenvs/pi-ble/program

esphome:
  name: pi-ble

host:

logger:
  level: VERBOSE
  logs:
    esp32_ble_tracker: VERBOSE

external_components:
  - source:
      type: local
      path: ../components

esp32_ble_tracker:
  id: ble_tracker
  hci_device: hci0
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

binary_sensor:
  - platform: ble_presence
    name: "BLE Presence Test"
    mac_address: 0C:4E:A0:86:D2:72  # a nearby Govee humidity sensor
    timeout: 1min

sensor:
  - platform: ble_rssi
    name: "BLE RSSI Test"
    mac_address: 0C:4E:A0:86:D2:72
