# Minimal scan gateway: presence + RSSI for one device, on the host BlueZ D-Bus
# backend. VERBOSE so the decoded RSSI value is logged ("'<name>' >> <rssi>");
# the scanner is lowered to DEBUG to cut noise.
esphome:
  name: ble-scanner

host:

logger:
  level: VERBOSE
  logs:
    esp32_ble_tracker: DEBUG

external_components:
  - source:
      type: local
      path: ../components

esp32_ble_tracker:
  scan_parameters:
    active: true

binary_sensor:
  - platform: ble_presence
    name: "scanner presence"
    mac_address: A4:C1:38:00:00:10

sensor:
  - platform: ble_rssi
    name: "scanner rssi"
    mac_address: A4:C1:38:00:00:10
