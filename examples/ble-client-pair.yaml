# BLE pairing automation: passkey reply, numeric comparison, remove bond.
# A live passkey flow needs a pairing-required peripheral.
esphome:
  name: ble-client-pair
  platformio_options:
    board_build.cmake_extra_args: >-
      -DCMAKE_C_COMPILER_LAUNCHER=ccache
      -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
host:
logger:
external_components:
  - source: {type: local, path: ../components}
esp32_ble_tracker:
ble_client:
  - mac_address: 40:4C:CA:57:8B:76
    id: c6
    on_passkey_request:
      then:
        - ble_client.passkey_reply:
            id: c6
            passkey: 123456
    on_passkey_notification:
      then:
        - logger.log:
            format: "passkey: %06u"
            args: [passkey]
    on_numeric_comparison_request:
      then:
        - ble_client.numeric_comparison_reply:
            id: c6
            accept: true
button:
  - platform: template
    name: "Remove Bond"
    on_press:
      - ble_client.remove_bond:
          id: c6
