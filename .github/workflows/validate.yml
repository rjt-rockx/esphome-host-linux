name: Validate

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: unit (C++ logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run C++ unit tests
        run: bash tests/unit/run.sh

  config-tests:
    name: config (esphome validate + fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip
      - run: pip install "esphome==2026.8.0"
      - name: Validate examples + valid/invalid fixtures
        run: python3 tests/config/run.py

  integration-tests:
    name: integration (host binary vs. fake org.bluez)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host build deps + dbusmock harness
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            liblgpio-dev libgpiod-dev libmosquitto-dev libsystemd-dev libmbedtls-dev build-essential \
            python3-dbusmock python3-dbus python3-gi python3-pytest dbus
      - name: Install esphome (isolated; invoked as a subprocess by the harness)
        run: pipx install "esphome==2026.8.0"
      - name: Run integration tests under the system python3
        # The harness imports dbusmock (apt, system python3) and spawns a private
        # system bus; sd-bus in the compiled binary honors DBUS_SYSTEM_BUS_ADDRESS.
        # Binaries are compiled on demand via the ESPHOME entrypoint.
        run: |
          cd tests/integration
          unset DBUS_SYSTEM_BUS_ADDRESS
          ESPHOME="$(command -v esphome)" python3 -m pytest -v -p no:cacheprovider

  esphome-compile-host:
    name: esphome compile (Linux host binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblgpio-dev libgpiod-dev libmosquitto-dev libsystemd-dev libmbedtls-dev build-essential
      - run: pip install --upgrade pip
      - run: pip install "esphome==2026.8.0"
      - name: Compile each example for host target
        run: |
          set -e
          for f in examples/*.yaml; do
            echo "::group::compile $f"
            esphome -s name_add_mac_suffix false compile "$f"
            echo "::endgroup::"
          done
